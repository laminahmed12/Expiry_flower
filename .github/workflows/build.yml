name: Build ADREEMK Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: adreemk-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Restore permanent release keystore
      env:
        RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      run: |
        printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore
        test -s release.keystore
        chmod 600 release.keystore

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Build signed release APK
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

    - name: Prepare commercial release package
      run: |
        set -e
        mkdir -p dist
        APK="app/build/outputs/apk/release/app-release.apk"
        OUT="dist/ADREEMK-ExpiryGuard-v1.0.2.apk"
        cp "$APK" "$OUT"

        sha256sum "$OUT" > dist/ADREEMK-ExpiryGuard-v1.0.2.sha256
        SHA256=$(cut -d ' ' -f1 dist/ADREEMK-ExpiryGuard-v1.0.2.sha256)
        SIZE=$(stat -c%s "$OUT")

        cat > dist/ADREEMK-ExpiryGuard-v1.0.2-RELEASE-INFO.txt <<EOF
ADREEMK ExpiryGuard
Commercial Release Package
Version: 1.0.2
Application ID: com.aistudio.expiryguard.kspwvx
Build type: Release
Distribution: Direct APK

APK file:
ADREEMK-ExpiryGuard-v1.0.2.apk

SHA-256:
$SHA256

APK size (bytes):
$SIZE

Verification:
Calculate SHA-256 for the downloaded APK and compare it with the SHA-256 value above.
If the values match exactly, the APK file is intact and unchanged.

This file belongs to the same build package as the APK and checksum file.
EOF

        cd dist
        zip -q ADREEMK-ExpiryGuard-v1.0.2-COMMERCIAL.zip           ADREEMK-ExpiryGuard-v1.0.2.apk           ADREEMK-ExpiryGuard-v1.0.2.sha256           ADREEMK-ExpiryGuard-v1.0.2-RELEASE-INFO.txt

    - name: Upload commercial release package
      uses: actions/upload-artifact@v4
      with:
        name: ADREEMK-ExpiryGuard-v1.0.2
        path: dist/
        if-no-files-found: error
        retention-days: 90
