name: Build ADREEMK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: adreemk-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Debug Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Build APK
      run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

    - name: Prepare shareable APK
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/ADREEMK-ExpiryGuard-v1.0.1.apk
        sha256sum dist/ADREEMK-ExpiryGuard-v1.0.1.apk > dist/ADREEMK-ExpiryGuard-v1.0.1.sha256

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ADREEMK-ExpiryGuard-v1.0.1
        path: dist/
        if-no-files-found: error
        retention-days: 30
