name: Build ADREEMK Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: adreemk-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate release signing key
      run: |
        keytool -genkeypair -v \
          -keystore release.keystore \
          -storepass "${{ secrets.RELEASE_STORE_PASSWORD || 'ExpiryGuardRelease2026' }}" \
          -alias "upload" \
          -keypass "${{ secrets.RELEASE_KEY_PASSWORD || 'ExpiryGuardRelease2026' }}" \
          -keyalg RSA -keysize 4096 -validity 10000 \
          -dname "CN=ADREEMK ExpiryGuard, OU=Release, O=ADREEMK, C=LY"

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Build signed release APK
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'ExpiryGuardRelease2026' }}
        KEY_ALIAS: upload
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'ExpiryGuardRelease2026' }}
      run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

    - name: Verify release artifact
      run: |
        test -s app/build/outputs/apk/release/app-release.apk
        sha256sum app/build/outputs/apk/release/app-release.apk | tee app-release.sha256

    - name: Prepare commercial release package
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/ADREEMK-ExpiryGuard-v1.0.2.apk
        cp app-release.sha256 dist/ADREEMK-ExpiryGuard-v1.0.2.sha256
        keytool -list -v -keystore release.keystore \
          -storepass "${{ secrets.RELEASE_STORE_PASSWORD || 'ExpiryGuardRelease2026' }}" \
          -alias upload | grep -E "Alias name:|Entry type:|SHA256:" > dist/signing-fingerprint.txt
        cat > dist/RELEASE-NOTES.txt <<'EOF'
ADREEMK ExpiryGuard 1.0.2
Commercial Android release for direct distribution outside Google Play.

Important:
- Preserve the release signing keystore and its passwords for all future updates.
- Do not publish the keystore.
- APK SHA-256 is included in the accompanying .sha256 file.
EOF

    - name: Upload commercial release
      uses: actions/upload-artifact@v4
      with:
        name: ADREEMK-ExpiryGuard-v1.0.2
        path: dist/
        if-no-files-found: error
        retention-days: 90
